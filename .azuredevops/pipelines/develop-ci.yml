name: develop_ci_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - develop
  paths:
    include:
      - src/**
      - tests/**
      - .azuredevops/**

pr: none

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

stages:
  - stage: Build_Test
    displayName: 'Build and Test'
    jobs:
      - job: CI
        displayName: 'CI'
        steps:
          - template: ../templates/dotnet-restore-build-test.yml
            parameters:
              solution: '**/*.sln'
              buildConfiguration: '$(buildConfiguration)'
              testProjects: 'tests/**/*.csproj'
      - job: Notify
        displayName: 'Notify'
        dependsOn: CI
        condition: always()          # run even if CI failed
        variables:
          - group: vg-general        # where your webhook URL lives
        steps:
          - template: ../templates/notify-slack.yml   # or notify-teams.yml
            parameters:
              stageName: 'Build and Test (develop)'
              status: $[ dependencies.CI.result ]     # 'succeeded', 'failed', 'canceled
